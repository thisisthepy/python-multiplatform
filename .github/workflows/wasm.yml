name: WasmJS CI

# Two jobs, because the runner can do one of these two things unconditionally and the other only
# when it has been given an interpreter.
#
# The single job this replaces asked for `wasmJsNodeTest` on a runner with no CPython Emscripten
# build. Every wasm task is guarded by `onlyIf { <that build>.exists() }`, so the task SKIPped and
# the job reported **green having run zero tests** -- a tick that measured nothing, which is worse
# than a red one because nobody goes looking. See `wasmRuntimePresent` in
# python-multiplatform/build.gradle.kts.
#
# `compile` is what a runner can always do honestly, and it is named for exactly that.
# `test` builds the runtime itself and runs the real suite against it. Leader, Decision 11 (a),
# 2026-11-26 (team report pmp-binder.md): "wasm.yml's test job runs build-cpython.sh itself, output in
# actions/cache keyed on the script and _pm_upcall.c hashes. No release asset." Until then the job
# was gated on a `WASM_RUNTIME_URL` repository variable that was never set, so it never ran.

on:
  # Runs only as part of ci.yml, which is started by hand (owner, 2026-11-14: "개발 테스트 ci는
  # 명시적으로 실행하기"). ci.yml holds the one concurrency group for the repository.
  workflow_call:

jobs:
  compile:
    name: WasmJS compile (no interpreter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      # No test task here, deliberately. Compiling `wasmJsMain` and `wasmJsTest` needs no
      # interpreter, so this is coverage the runner can actually deliver; asking for a test task it
      # cannot run is what produced the empty green tick.
      - name: Compile wasmJs main and test sources
        run: ./gradlew :python-multiplatform:compileKotlinWasmJs :python-multiplatform:wasmJsTestClasses --console=plain

  test:
    name: WasmJS Node + browser tests (CPython 3.15t built here)
    runs-on: ubuntu-24.04
    # A cold cache is a full CPython build (a free-threaded build Python, then the wasm32 cross build).
    timeout-minutes: 150
    env:
      # build-cpython.sh's default staging directory, and the one -PwasmPythonDir points at below.
      WASM_RUNTIME_DIR: ${{ github.workspace }}/.caches/wasm-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      # CPython 3.15.0 pins node 24 (Platforms/emscripten/config.toml, node-version); the runtime is
      # built with -fwasm-exceptions and pthreads, and the test tasks run it under this node.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      # The staged runtime (python.wasm, python.mjs, the stdlib zip) is a pure function of the build
      # script and the C module it compiles in, so those two hashes are the key (Decision 11 (a)).
      # Restore and save are separate steps so that a red test run still keeps a runtime that built
      # and passed its own checks; no restore-keys, a runtime from another script is never reused.
      - name: Restore the CPython 3.15t runtime
        id: runtime
        uses: actions/cache/restore@v4
        with:
          path: .caches/wasm-runtime
          key: wasm-cpython315t-${{ runner.os }}-${{ hashFiles('python-multiplatform/scripts/wasm/build-cpython.sh', 'python-multiplatform/scripts/wasm/_pm_upcall.c') }}

      - name: Install build Python prerequisites
        if: steps.runtime.outputs.cache-hit != 'true'
        run: >
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libssl-dev zlib1g-dev libffi-dev
          libbz2-dev liblzma-dev libsqlite3-dev libzstd-dev

      # The script's default `all`: build, zip, verify (ABI tags, shared memory, Py_GIL_DISABLED,
      # the _pm_upcall exports), smoke.py under python.sh, stage, and the embedding probe against the
      # staged runtime. Any of them failing stops here, before a runtime is cached.
      - name: Build CPython 3.15t for wasm32-emscripten
        if: steps.runtime.outputs.cache-hit != 'true'
        run: bash python-multiplatform/scripts/wasm/build-cpython.sh

      - name: Save the CPython 3.15t runtime
        if: steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .caches/wasm-runtime
          key: ${{ steps.runtime.outputs.cache-primary-key }}

      - name: Check the runtime
        run: |
          set -euo pipefail
          for f in python.wasm python.mjs python3.15t.zip; do
            test -f "$WASM_RUNTIME_DIR/$f" \
              || { echo "::error::$f is not in $WASM_RUNTIME_DIR"; exit 1; }
          done
          ls -l "$WASM_RUNTIME_DIR"

      # `WasmCompiledWheelTest` imports a real compiled pyemscripten_2026_0 wheel. Under
      # `-PrequireWasmRuntime` a missing wheel is a failure, not a skip, so fetch them first: by URL,
      # each accepted only against the sha256 the script pins. The script pins none today: the
      # wheel has to be a pypackpack-built cp315t one (leader, Decision 10 (c) c1, 2026-11-26), and
      # until pypackpack #82 produces it this job fails on that one test, by name, by design.
      - name: Fetch the pinned wasm wheels
        run: bash python-multiplatform/scripts/wasm/build-cpython.sh wheels

      # `-PrequireWasmRuntime` is the second half of the guard, and it is what makes this job unable
      # to repeat the original defect: if either task would skip -- no interpreter, or no
      # Chromium-family browser for karma -- the build fails naming what was missing, instead of
      # reporting success having run nothing.
      #
      # `--continue`: one suite's failure must not hide the other's result. Without it a red
      # wasmJsNodeTest (run 45829018834: only WasmCompiledWheelTest, Decision 10 (c) c1) stopped Gradle
      # before wasmJsBrowserTest ran, and the browser suite reported nothing. The step still fails
      # when either suite does.
      - name: Run wasmJs tests
        run: |
          ./gradlew \
            :python-multiplatform:wasmJsNodeTest \
            :python-multiplatform:wasmJsBrowserTest \
            -PwasmPythonDir="$WASM_RUNTIME_DIR" \
            -PrequireWasmRuntime=true \
            --continue \
            --console=plain

      # Belt to the guard's braces, and it guards a different failure: a task that *runs* but
      # reports nothing. A wasm `LinkError` at instantiation takes out the whole module and is
      # reported as zero tests rather than as a failure, which is the shape ROADMAP §10 records for
      # a missing stdlib zip in the browser ("404, zero tests reported").
      #
      # The floors are the baselines ROADMAP §10 records, so they fail when coverage *shrinks* and
      # stay quiet when it grows.
      - name: Assert the suites were not empty
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          floors = {"wasmJsNodeTest": 344, "wasmJsBrowserTest": 10}
          bad = False
          for task, floor in floors.items():
              files = glob.glob(f"python-multiplatform/build/test-results/{task}/*.xml")
              total = sum(int(ET.parse(f).getroot().get("tests", 0)) for f in files)
              print(f"{task}: {total} tests in {len(files)} result files (floor {floor})")
              if total < floor:
                  print(f"::error::{task} reported {total} tests, below its recorded baseline of {floor}")
                  bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-test-results
          path: python-multiplatform/build/test-results/
          if-no-files-found: error
