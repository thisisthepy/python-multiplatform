name: Desktop CI

on:
  # Runs only as part of ci.yml, which is started by hand (owner, 2026-11-14: "개발 테스트 ci는
  # 명시적으로 실행하기"). ci.yml holds the one concurrency group for the repository.
  workflow_call:

jobs:
  test:
    name: Desktop Tests
    # macOS runner is used to compile for iOS and is also good for Desktop.
    # We use ubuntu, macos, and windows to cover the major desktop platforms.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          # This automatically caches ~/.gradle/caches and ~/.gradle/wrapper
          cache: 'gradle'

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          # Cache Kotlin Native compiler and dependencies
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      # The dev agent's protocol (SPEC L-12, #233): stdlib-only, so the runner's own python3 runs it.
      - name: Dev agent protocol tests
        working-directory: python-multiplatform/src/test/python
        run: python3 -m unittest -v test_devagent

      - name: Run Desktop Tests
        # Using --console=plain so logs are readable in GitHub Actions
        run: ./gradlew :python-multiplatform:desktopTest --console=plain

  artifact-fixture:
    # The artifact walker's consumer suite (AGENTS.md section 15: plugin unit tests cannot see what the
    # generated table does at run time). It had no CI step, so SPEC B-5b/B-5c (#164 items 4 and 5,
    # the walked kotlinx-coroutines dispatcher path) had no run to point at.
    name: Artifact walker fixture (desktop)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Run the artifact fixture's desktop tests
        # --rerun and a deleted result directory: never read an earlier result as this run's (AGENTS.md rule 8).
        run: |
          rm -rf python-multiplatform-gradle-plugin/fixtures/artifact/build/test-results/desktopTest
          ./gradlew :python-multiplatform-gradle-plugin-fixtures:artifact:desktopTest --rerun --console=plain

      - name: Count the tests (the coroutines suite must have run)
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          classes = set()
          for f in glob.glob("python-multiplatform-gradle-plugin/fixtures/artifact/build/test-results/desktopTest/*.xml"):
              for c in ET.parse(f).getroot().iter("testcase"):
                  total += 1
                  classes.add(c.get("classname"))
                  failed += c.find("failure") is not None or c.find("error") is not None
                  skipped += c.find("skipped") is not None
          line = f"artifact fixture: {total} tests, {failed} failed, {skipped} skipped"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(line + "\n")
          if "fixture.artifact.WalkedArtifactCoroutinesTest" not in classes or failed or skipped:
              sys.exit("WalkedArtifactCoroutinesTest did not run, or a test failed or skipped")
          PY

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-fixture-reports
          path: python-multiplatform-gradle-plugin/fixtures/artifact/build/reports/tests/desktopTest
      # SPEC L-9c (#191): a macosArm64 consumer linked and packaged only by the bindings plugin. The test
      # task runs with the staged PYTHONHOME; the release executable then runs with none, from another
      # directory, so python-multiplatform-home beside it is the only prefix it can find.
      - name: Desktop native consumer (macosArm64), host test
        run: ./gradlew :python-multiplatform-gradle-plugin-fixtures:desktop-native-consumer:macosArm64Test --rerun --console=plain

      - name: Desktop native consumer (macosArm64), packaged executable
        run: |
          set -euo pipefail
          ./gradlew :python-multiplatform-gradle-plugin-fixtures:desktop-native-consumer:linkReleaseExecutableMacosArm64 --console=plain
          DIR=python-multiplatform-gradle-plugin/fixtures/desktop-native-consumer/build/bin/macosArm64/releaseExecutable
          test -d "$DIR/python-multiplatform-home" || { echo "::error::no python-multiplatform-home beside the executable"; exit 1; }
          LINE=$(cd "$RUNNER_TEMP" && env -u PYTHONHOME "$GITHUB_WORKSPACE/$DIR/desktop-native-consumer.kexe" | grep DESKTOP_NATIVE_PROBE)
          echo "$LINE"
          test "$LINE" = "DESKTOP_NATIVE_PROBE stdlib=ok ext=ok ft=ok"

      # #191: Python draws material3 composables on Kotlin/Native (macosArm64) through the fork's walked
      # klibs; Text and Button go through the B3 compiler plugin, whose unrewritten marker would throw.
      - name: Compose on Kotlin/Native (macosArm64), host test
        run: ./gradlew :python-multiplatform-compose:fixtures:compose-native:macosArm64Test --rerun --console=plain
      # SPEC B-6b (#191, from #172 item 5): input-method composition decoded by Compose's AWT layer, in a
      # real window. The macOS runner has a display; the task fails if no window test matched.
      - name: Real-window input method test (Compose host fixture)
        run: ./gradlew :python-multiplatform-compose:fixtures:compose:desktopWindowTest --rerun --console=plain

      - name: Upload the real-window test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-window-test-reports
          path: python-multiplatform-compose/fixtures/compose/build/reports/tests/desktopWindowTest

  plugin-unit:
    # The Gradle plugin's own unit tests (#403). Only its fixtures ran in CI before, so plugin
    # unit tests were never executed (leader decision 2026-11-13). Linux: the tests use fake
    # trees and need no Xcode or simulator.
    name: Gradle plugin unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Run the plugin's unit tests
        # --rerun: never read an earlier result as this run's (AGENTS.md rule 8).
        run: ./gradlew :python-multiplatform-gradle-plugin:test --rerun --console=plain

      - name: Count the tests
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("python-multiplatform-gradle-plugin/build/test-results/test/*.xml")
          total = failed = skipped = 0
          for f in files:
              suite = ET.parse(f).getroot()
              total += int(suite.get("tests", 0))
              failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
              skipped += int(suite.get("skipped", 0))
          print(f"Gradle plugin unit tests: {total} tests, {total - failed - skipped} passed, {failed} failed, {skipped} skipped ({len(files)} suites)")
          if not files:
              raise SystemExit("no plugin test results were written")
          PY
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-plugin-unit-reports
          path: |
            python-multiplatform-gradle-plugin/build/reports/tests/test
            python-multiplatform-gradle-plugin/build/test-results/test

  desktop-native-linux:
    name: Desktop Kotlin/Native Tests (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run Linux x86_64 Kotlin/Native Tests
        run: ./gradlew :python-multiplatform:linuxX64Test --rerun --console=plain

      # SPEC L-9c (#191): a linuxX64 consumer linked and packaged only by the bindings plugin. The test
      # task runs with the staged PYTHONHOME; the release executable then runs with none, from another
      # directory, so python-multiplatform-home beside it is the only prefix it can find.
      - name: Desktop native consumer (linuxX64), host test
        run: ./gradlew :python-multiplatform-gradle-plugin-fixtures:desktop-native-consumer:linuxX64Test --rerun --console=plain

      - name: Desktop native consumer (linuxX64), packaged executable
        run: |
          set -euo pipefail
          ./gradlew :python-multiplatform-gradle-plugin-fixtures:desktop-native-consumer:linkReleaseExecutableLinuxX64 --console=plain
          DIR=python-multiplatform-gradle-plugin/fixtures/desktop-native-consumer/build/bin/linuxX64/releaseExecutable
          test -d "$DIR/python-multiplatform-home" || { echo "::error::no python-multiplatform-home beside the executable"; exit 1; }
          LINE=$(cd "$RUNNER_TEMP" && env -u PYTHONHOME "$GITHUB_WORKSPACE/$DIR/desktop-native-consumer.kexe" | grep DESKTOP_NATIVE_PROBE)
          echo "$LINE"
          test "$LINE" = "DESKTOP_NATIVE_PROBE stdlib=ok ext=ok ft=ok"

      # #191: Python draws material3 composables on Kotlin/Native (linuxX64) through the fork's walked
      # klibs; Text and Button go through the B3 compiler plugin, whose unrewritten marker would throw.
      - name: Compose on Kotlin/Native (linuxX64), host test
        run: ./gradlew :python-multiplatform-compose:fixtures:compose-native:linuxX64Test --rerun --console=plain

      # The Compose host's linuxX64 target (#386): compiled here, since only the fork publishes the
      # Compose UI klibs for linuxX64.
      - name: Compile the Compose host for Linux x86_64 Kotlin/Native
        run: ./gradlew :python-multiplatform-compose:compileKotlinLinuxX64 --rerun --console=plain

  desktop-native-windows:
    # SPEC P-1a (#191): the Windows Kotlin/Native desktop target. mingwX64Test links the free-threaded
    # python315t.lib, finds python315t.dll on PATH and the stdlib through PYTHONHOME (both set by the
    # library's own task configuration).
    name: Desktop Kotlin/Native Tests (Windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17 as well: the compiler plugin and KSP compile with a languageVersion=17 toolchain, and
      # Gradle's auto-detection does not find the runner's preinstalled 17 on Windows (batch run
      # 44945907475). setup-java exports JAVA_HOME_17_X64; the Gradle step names it. 21 stays the default.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: |
            17
            21
          distribution: 'zulu'
          cache: 'gradle'

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run Windows x86_64 Kotlin/Native Tests
        shell: bash
        run: ./gradlew :python-multiplatform:mingwX64Test --rerun --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

      - name: Count the tests
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET
          files = glob.glob("python-multiplatform/build/test-results/mingwX64Test/*.xml")
          total = failed = skipped = 0
          for f in files:
              for c in ET.parse(f).getroot().iter("testcase"):
                  total += 1
                  failed += c.find("failure") is not None or c.find("error") is not None
                  skipped += c.find("skipped") is not None
          line = f"mingwX64Test: {total} tests, {failed} failed, {skipped} skipped ({len(files)} files)"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(line + "\n")
          if not files or failed:
              sys.exit("mingwX64Test did not run, or a test failed")
          PY

      # SPEC L-9c on Windows (#191): a mingwX64 consumer linked and packaged only by the bindings plugin
      # (python315t.lib, the DLLs beside the executable, Lib/ and DLLs/ in python-multiplatform-home).
      # The packaged executable then runs from another directory with no PYTHONHOME.
      - name: Desktop native consumer (mingwX64), host test
        if: ${{ !cancelled() }}
        shell: bash
        run: ./gradlew :python-multiplatform-gradle-plugin-fixtures:desktop-native-consumer:mingwX64Test --rerun --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

      - name: Desktop native consumer (mingwX64), packaged executable
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :python-multiplatform-gradle-plugin-fixtures:desktop-native-consumer:linkReleaseExecutableMingwX64 --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
          DIR=python-multiplatform-gradle-plugin/fixtures/desktop-native-consumer/build/bin/mingwX64/releaseExecutable
          test -d "$DIR/python-multiplatform-home" || { echo "::error::no python-multiplatform-home beside the executable"; exit 1; }
          LINE=$(cd "$RUNNER_TEMP" && env -u PYTHONHOME "$GITHUB_WORKSPACE/$DIR/desktop-native-consumer.exe" | tr -d '\r' | grep DESKTOP_NATIVE_PROBE)
          echo "$LINE"
          test "$LINE" = "DESKTOP_NATIVE_PROBE stdlib=ok ext=ok ft=ok"

      # #191: Python draws material3 on Windows Kotlin/Native through the walked klibs and B3, as on Linux.
      - name: Compose on Kotlin/Native (mingwX64), host test
        if: ${{ !cancelled() }}
        shell: bash
        run: ./gradlew :python-multiplatform-compose:fixtures:compose-native:mingwX64Test --rerun --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

  # The dev agent's protocol on the other desktop OSes (#238). Its socket options differ per platform
  # (SO_EXCLUSIVEADDRUSE on Windows, SO_REUSEADDR on POSIX), and the port-takeover and restart tests are
  # what check them. Stdlib only: no JDK, no Gradle.
  dev-agent:
    name: Dev agent protocol (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Dev agent protocol tests
        working-directory: python-multiplatform/src/test/python
        run: python -m unittest -v test_devagent

  # pythonx-compose's UI.ipynb, end to end (#26, #213): the installed pythonx-compose wheel drives a
  # real desktop Compose host, pixel-compared with the same composables drawn from Kotlin. Its own
  # job and Gradle invocation, so it neither hides nor is hidden by the module tests above.
  notebook-e2e:
    name: Notebook E2E (pythonx-compose wheel)
    runs-on: macos-latest
    env:
      WHEEL_DIR: ${{ github.workspace }}/.tmp/pythonx-compose-dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Beside this repository, as on a developer machine; the wheel is built from it, not installed
      # from PyPI, so the scenarios follow pythonx-compose develop.
      - name: Checkout pythonx-compose develop
        uses: actions/checkout@v4
        with:
          repository: thisisthepy/pythonx-compose
          ref: develop
          path: .tmp/pythonx-compose
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build the pythonx-compose wheel
        run: |
          uv build --wheel --directory .tmp/pythonx-compose --out-dir "$WHEEL_DIR"
          ls -l "$WHEEL_DIR"
          git -C .tmp/pythonx-compose log -1 --format='pythonx-compose %h %s'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      # No skip property: without a wheel every scenario fails by name, which is what CI wants.
      - name: Run the notebook scenarios
        run: >
          ./gradlew :python-multiplatform-compose:fixtures:notebook-e2e:desktopTest --rerun
          -PpythonxComposeWheel="$WHEEL_DIR" --console=plain

      - name: Count the scenarios
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("python-multiplatform-compose/fixtures/notebook-e2e/build/test-results/desktopTest/*.xml")
          total = failed = skipped = 0
          for f in files:
              suite = ET.parse(f).getroot()
              total += int(suite.get("tests", 0))
              failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
              skipped += int(suite.get("skipped", 0))
          print(f"Notebook E2E: {total} tests, {total - failed - skipped} passed, {failed} failed, {skipped} skipped ({len(files)} suites)")
          PY
          cat "$GITHUB_STEP_SUMMARY"

      # #191: the same scenarios, wheel and app module on Kotlin/Native desktop (macosArm64), through
      # the fork's walked klibs and the B3 compiler plugin. Its own Gradle invocation, and it runs even
      # when the JVM scenarios failed, so each path reports for itself.
      - name: Run the notebook scenarios on Kotlin/Native (macosArm64)
        if: ${{ !cancelled() }}
        run: >
          ./gradlew :python-multiplatform-compose:fixtures:notebook-native:macosArm64Test --rerun
          -PpythonxComposeWheel="$WHEEL_DIR" --console=plain

      - name: Count the Kotlin/Native scenarios
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("python-multiplatform-compose/fixtures/notebook-native/build/test-results/macosArm64Test/*.xml")
          total = failed = skipped = 0
          for f in files:
              suite = ET.parse(f).getroot()
              total += int(suite.get("tests", 0))
              failed += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
              skipped += int(suite.get("skipped", 0))
          print(f"Notebook E2E on Kotlin/Native (macosArm64): {total} tests, {total - failed - skipped} passed, {failed} failed, {skipped} skipped ({len(files)} suites)")
          if not files:
              sys.exit("the Kotlin/Native notebook scenarios did not run")
          PY

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-e2e-reports
          path: |
            python-multiplatform-compose/fixtures/notebook-e2e/build/reports/tests/desktopTest
            python-multiplatform-compose/fixtures/notebook-e2e/build/test-results/desktopTest
            python-multiplatform-compose/fixtures/notebook-native/build/reports/tests/macosArm64Test
            python-multiplatform-compose/fixtures/notebook-native/build/test-results/macosArm64Test

  # The notebook E2E in a GraalVM native image on macOS (#249, #251). It takes the fork's Compose
  # (`org.thisisthepy.compose.*:1.11.1-ext.2`, `composeExtended.*` in `gradle.properties`) from
  # Maven Central, builds the 20-scenario executable with Liberica NIK 25, and runs it with
  # JAVA_HOME and PYTHONHOME removed.
  notebook-e2e-native-image:
    name: Notebook E2E in a native image (macOS)
    runs-on: macos-latest
    env:
      WHEEL_DIR: ${{ github.workspace }}/.tmp/pythonx-compose-dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pythonx-compose develop
        uses: actions/checkout@v4
        with:
          repository: thisisthepy/pythonx-compose
          ref: develop
          path: .tmp/pythonx-compose
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build the pythonx-compose wheel
        run: uv build --wheel --directory .tmp/pythonx-compose --out-dir "$WHEEL_DIR"

      - name: Setup Java 21 (Gradle)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      # The JDK 25 toolchain native-image comes from, found by Gradle's toolchain resolution.
      - name: Setup Liberica NIK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'liberica'
          set-java-home: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Records Compose and skiko's configuration against the fork version this run uses, then builds
      # the image and runs it with JAVA_HOME and PYTHONHOME removed: 20 of 20 and no libjvm.
      # `setup-graalvm` installs Liberica NIK under `GRAALVM_HOME` in the runner toolcache outside
      # `/Users/runner/hostedtoolcache/Java_*`, so pass `org.gradle.java.installations.paths`
      # explicitly so Gradle's BellSoft JDK 25 toolchain resolution finds it.
      - name: Build and run the native image
        run: >
          ./gradlew :python-multiplatform-compose:fixtures:notebook-e2e:notebookE2eNativeAgent
          :python-multiplatform-compose:fixtures:notebook-e2e:notebookE2eNativeRun
          -PpythonxComposeWheel="$WHEEL_DIR"
          -Porg.gradle.java.installations.paths="$GRAALVM_HOME"
          --console=plain
