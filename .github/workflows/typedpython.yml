name: TypedPython CI

# The TypedPython gate and compiler are Python (python-multiplatform-ksp/src/{main,test}/python).
# Gradle does not run them; this workflow does.
on:
  push:
    branches: [ "develop", "main" ]
    paths: [ "python-multiplatform-ksp/**", ".github/workflows/typedpython.yml" ]
  pull_request:
    branches: [ "develop", "main" ]
    paths: [ "python-multiplatform-ksp/**", ".github/workflows/typedpython.yml" ]

jobs:
  test:
    name: TypedPython tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: python-multiplatform-ksp
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Create the environment
        # pyrefly is pinned exactly: the gate reads its versioned type-report format.
        run: |
          uv venv .venv --python 3.13
          uv pip install --python .venv/bin/python "pyrefly==1.3.2" pytest

      - name: Behaviour tests
        run: .venv/bin/python -m pytest -q -m "not measurement"

      - name: Measurements (recorded, sanity bounds only)
        # A shared runner is not an idle machine (AGENTS.md §8): read ratios, not absolute times.
        run: .venv/bin/python -m pytest -q -s -m measurement
