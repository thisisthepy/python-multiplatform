name: Android Native CI

on:
  # Runs only as part of ci.yml, which is started by hand (owner, 2026-11-14: "개발 테스트 ci는
  # 명시적으로 실행하기"). ci.yml holds the one concurrency group for the repository.
  workflow_call:

jobs:
  compile:
    name: Compile Android Native
    # ubuntu-latest is sufficient and faster for cross-compiling to Android Native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Compile Android Native Arm64
        # Compile Android Native which includes commonMain + nativeMain + artMain
        run: ./gradlew :python-multiplatform:compileKotlinAndroidNativeArm64 --console=plain
