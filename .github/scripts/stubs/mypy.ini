[mypy]
python_version = 3.13
strict = True
# A `# type: ignore` in the consumer that no longer ignores anything means a stub stopped rejecting a
# line it should reject, so it fails the check ...
warn_unused_ignores = True

# ... but the generated stubs carry their own, deliberate ignores (`overload-cannot-match` on the
# overloads Python's types cannot tell apart), and not every one is needed for every Compose version.
[mypy-androidx.*,kotlin.*,java.*,javax.*,org.*,junit.*,fixture.*]
warn_unused_ignores = False
