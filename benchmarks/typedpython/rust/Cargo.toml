[package]
name = "typedpython-bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nbody"
path = "src/bin/nbody.rs"

[[bin]]
name = "spectral_norm"
path = "src/bin/spectral_norm.rs"

[[bin]]
name = "fannkuch"
