#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#iOS
xcodeproj=sample/src/iosMain/app.xcodeproj

#MPP
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.useEmbeddableCompilerJar=true
kotlin.native.binary.memoryModel=experimental
kotlin.native.binary.sourceInfoType=libbacktrace

#Compose
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.uikit.enabled=true

# Python Build
pythonVersion=3.14.7
pythonFreeThreaded=false
pythonBuildStandaloneRelease=20260807
pythonAppleSupportBuild=b11

# GraalVM native-image (sample's nativeCompile task). Liberica NIK is not in a location Gradle's
# toolchain auto-detection scans, so it is registered explicitly here. Adding a path only makes a
# JDK discoverable for tasks that ask for it by JavaLanguageVersion(25); it does not change the
# toolchain any existing task resolves to. See AGENTS.md §19 for why tooling lives
# under /Volumes/macMini rather than the internal disk.
org.gradle.java.installations.paths=/Volumes/macMini/toolchains/bellsoft-liberica-vm-full-openjdk25-25.0.4/Contents/Home
