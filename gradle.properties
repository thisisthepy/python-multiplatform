#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#iOS
xcodeproj=sample/src/iosMain/app.xcodeproj

#MPP
kotlin.mpp.stability.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.useEmbeddableCompilerJar=true
kotlin.native.binary.memoryModel=experimental
kotlin.native.binary.sourceInfoType=libbacktrace

#Compose
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.uikit.enabled=true
# org.thisisthepy.compose:compose-gradle-plugin:1.11.1-ext.3's Maven Central POM marks
# hot-reload-gradle-plugin as optional (shadow configuration), so Gradle does not place it on the
# plugin classpath unless disabled or declared separately.
org.jetbrains.compose.hot.reload.disable=true

# Python Build
pythonVersion=3.15.0
pythonFreeThreaded=false
pythonBuildStandaloneRelease=20261013
pythonAppleSupportBuild=b11

# GraalVM native-image (sample's nativeCompile task). Liberica NIK is not in a location Gradle's
# toolchain auto-detection scans, so it is registered explicitly here. Adding a path only makes a
# JDK discoverable for tasks that ask for it by JavaLanguageVersion(25); it does not change the
# toolchain any existing task resolves to. See AGENTS.md §19 for why tooling lives
# under /Volumes/macMini rather than the internal disk.
org.gradle.java.installations.paths=/Volumes/macMini/toolchains/bellsoft-liberica-vm-full-openjdk25-25.0.4/Contents/Home

# compose-multiplatform-core-extended (#191, #249): the Compose modules a native-image build takes from
# the fork instead of upstream, and where from. Read in one place, by the notebook E2E's native image;
# the fork's coordinates and version line are 1.11.1-ext.N, and only these lines follow.
composeExtended.version=1.11.1-ext.2
# The group the fork publishes under, as a prefix of upstream's (org.thisisthepy.compose).
composeExtended.groupPrefix=org.thisisthepy.compose
composeExtended.modules=org.thisisthepy.compose.ui:ui,org.thisisthepy.compose.ui:ui-desktop,org.thisisthepy.compose.ui:ui-text,org.thisisthepy.compose.ui:ui-text-desktop,org.thisisthepy.compose.foundation:foundation,org.thisisthepy.compose.foundation:foundation-desktop
composeExtended.mavenLocal=false
