# docs/design/pyi-generation-design.md §5.3's manifest, standing in for the one that would ship inside
# `pythonx-compose`.
#
# It is here rather than in the plugin on purpose: which Kotlin package a `pythonx` module wraps is
# the Python package's design decision, and §5.2 measures that it is not inferable --
# `pythonx.compose.layout` wraps `androidx.compose.foundation.layout`, dropping `foundation.`, and
# nothing in any artefact says so. The plugin reads this file; it does not know its contents.
#
# **Not agreed with `pythonx-compose`.** No such file exists in that repository today (§5.3's own
# closing note). This is the reader being exercised against the format the design proposes.

[modules]
"pythonx.compose.layout"  = "androidx.compose.foundation.layout"
"pythonx.compose.ui"      = "androidx.compose.ui"
"pythonx.compose.ui.unit" = "androidx.compose.ui.unit"

[value-classes]
# §3.4: `Dp`'s public constructor *is* the identity on the float it wraps, so `padding(16)` and
# `padding(Dp(16f))` mean the same thing. `TextUnit`, `Color` and every `packedValue` class are
# deliberately absent -- a raw number decodes as something else through each of them, and none of
# those failures raises.
raw-primitive-allowed = ["androidx.compose.ui.unit.Dp"]
