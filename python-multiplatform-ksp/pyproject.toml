# TypedPython soundness gate (docs/design/typedpython.md §4.2).
# The Kotlin processor in this module is built by Gradle; this file only describes the Python
# package that lives next to it in src/main/python.
[project]
name = "typedpython"
version = "0.1.0"
requires-python = ">=3.13"
# Pinned exactly: the gate reads Pyrefly's per-expression type report (--report-pysa), whose
# format is versioned by Pyrefly, not by a public API.
dependencies = ["pyrefly==1.3.2"]

[project.scripts]
typedpython = "typedpython.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/main/python/typedpython"]

[project.optional-dependencies]
test = ["pytest"]
# `typedpython demo` / compiler.compile_module: Cython and a C compiler for the host.
compile = ["cython>=3.1", "setuptools"]

[tool.pytest.ini_options]
testpaths = ["src/test/python"]
pythonpath = ["src/main/python"]
addopts = "--basetemp=.pytest_tmp"
markers = ["measurement: records cost; asserts only sanity bounds"]
